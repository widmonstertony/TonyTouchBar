name: Bug report
description: Report a TonyTouchBar problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please review your diagnostics ZIP before sharing it. Do not upload private information.
  - type: input
    id: version
    attributes:
      label: TonyTouchBar version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac model identifier
      placeholder: MacBookPro16,1
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and exact reproduction steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Drag in the reviewed diagnostics ZIP, or paste only the relevant lines.
